<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Administrace | FlowState</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <div class="logo" style="width: 140px; display: flex; justify-content: flex-start;">
            <a href="index.html">
                <img src="logo.png" alt="Logo" onerror="this.src='https://placehold.co/100x35/ccc/fff?text=LOGO'">
                <span>FlowState Admin</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="index.html">Zpět na web</a>
        </div>
        <div style="width: 140px;"></div>
    </nav>

    <main>
        <div class="card" style="max-width: 900px; width: 100%; text-align: left;">
            <h1>Přehled objednávek</h1>
            <p>Zde vidíte všechny objednávky od zákazníků v reálném čase.</p>
            
            <div id="admin-content" style="margin-top: 30px;">
                <p>Načítám objednávky...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tvuj-projekt.supabase.co';
        const SUPABASE_ANON_KEY = 'tvuj-anon-key';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAdminAndLoadOrders() {
            // 1. Zjistíme, kdo je aktuálně přihlášený
            const { data: { user } } = await supabase.auth.getUser();
            
            if (!user) {
                alert('Musíte se nejdříve přihlásit!');
                window.location.href = 'auth.html';
                return;
            }

            // 2. Ověříme v tabulce profiles, jestli má uživatel roli 'admin'
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (error || !profile || profile.role !== 'admin') {
                alert('Nemáte oprávnění přístupu do administrace.');
                window.location.href = 'index.html';
                return;
            }

            // 3. Pokud je admin, natáhneme všechny objednávky
            const { data: orders, error: ordersError } = await supabase
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            const container = document.getElementById('admin-content');
            
            if (ordersError || !orders || orders.length === 0) {
                container.innerHTML = '<p>Zatím evidujeme 0 objednávek.</p>';
                return;
            }

            let html = '<table style="width:100%; border-collapse: collapse; font-size: 0.95rem;">';
            html += '<tr style="border-bottom: 2px solid rgba(255,255,255,0.7); text-align: left;"><th style="padding: 10px;">ID</th><th style="padding: 10px;">Zákazník</th><th style="padding: 10px;">Cena</th><th style="padding: 10px;">Doprava</th><th style="padding: 10px;">Stav</th></tr>';
            
            orders.forEach(order => {
                html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.3);">
                    <td style="padding: 12px;">#${order.id}</td>
                    <td style="padding: 12px;">${order.shipping_address || 'Neznámo'}</td>
                    <td style="padding: 12px; font-weight:600;">${order.total_price} Kč</td>
                    <td style="padding: 12px;">${order.zasilkovna_id ? 'Zásilkovna (' + order.zasilkovna_id + ')' : 'Doručení'}</td>
                    <td style="padding: 12px;"><span style="background: #7ad3d9; padding: 4px 10px; border-radius: 10px; font-size: 0.8rem; color: #fff;">${order.status || 'Nová'}</span></td>
                </tr>`;
            });
            html += '</table>';
            
            container.innerHTML = html;
        }

        checkAdminAndLoadOrders();
    </script>
</body>
</html>
