<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Košík | AURA H20</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <nav>
        <!-- 1. Logo vlevo -->
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="Logo" onerror="this.src='https://placehold.co/100x35/ccc/fff?text=LOGO'">
                <span>FlowState</span>
            </a>
        </div>

        <!-- 2. Odkazy uprostřed -->
        <div class="nav-links">
            <a href="index.html">Úvod</a>
            <a href="shop.html">Obchod</a>
            <a href="kontakt.html">Kontakt</a>
        </div>

        <!-- 3. Košík vpravo -->
        <div>
            <a href="kosik.html" class="cart-icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px; stroke: currentColor;">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="nav-cart-badge" id="nav-cart-count">0</span>
            </a>
        </div>
    </nav>


    <main>
        <div class="card" style="max-width: 800px; width: 100%;">
            <h1 style="text-align: left; font-size: 2.5rem;">Váš košík</h1>
            
            <!-- Kontejner pro produkty -->
            <div id="cart-container" style="margin-top: 30px;">
                <!-- Zde se automaticky vygenerují produkty pomocí JS -->
            </div>

            <div class="cart-total-row">
                <span>Celkem k úhradě</span>
                <span id="cart-total">0 Kč</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 30px; align-items: center;">
                <a href="shop.html" style="color: #666; text-decoration: none; font-weight: 500;">&larr; Zpět do obchodu</a>
                <a href="objednavka.html" id="checkout-btn" class="btn-shop" style="padding: 15px 40px;">Přejít k pokladně &rarr;</a>
            </div>
        </div>
    </main>

    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('flowstate_cart')) || [];
            const container = document.getElementById('cart-container');
            const cartTotal = document.getElementById('cart-total');
            const navCartCount = document.getElementById('nav-cart-count');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            container.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align: left; margin: 40px 0;">Váš košík je zatím prázdný.</p>';
                checkoutBtn.style.display = 'none';
                cartTotal.textContent = '0 Kč';
                navCartCount.textContent = '0';
                return;
            }

            checkoutBtn.style.display = 'inline-flex';

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                totalItems += item.quantity;
                
                const itemHTML = `
                <div class="cart-item">
                    <img src="${item.img}" alt="Láhev" onerror="this.src='https://placehold.co/100x200/${item.hex}/fff?text=LÁHEV'">
                    <div class="cart-item-details">
                        <div class="cart-item-title">FlowState Láhev</div>
                        <div class="cart-item-subtitle">Objem: ${item.size} | Barva: ${item.color}</div>
                        <button class="remove-btn" onclick="removeItem(${index})">Odstranit</button>
                    </div>
                    <div class="cart-quantity">
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">&minus;</button>
                        <span style="font-weight:600; color:#222; width: 20px; text-align: center;">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">&plus;</button>
                    </div>
                    <div class="cart-item-price">${item.price * item.quantity} Kč</div>
                </div>
                `;
                container.innerHTML += itemHTML;
            });

            cartTotal.textContent = total + ' Kč';
            navCartCount.textContent = totalItems;
        }

        // Změna počtu kusů
        function changeQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('flowstate_cart'));
            if (cart[index].quantity + change > 0) {
                cart[index].quantity += change;
                localStorage.setItem('flowstate_cart', JSON.stringify(cart));
                renderCart();
            }
        }

        // Smazání celé položky
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('flowstate_cart'));
            cart.splice(index, 1);
            localStorage.setItem('flowstate_cart', JSON.stringify(cart));
            renderCart();
        }

        // Vykreslit košík po načtení stránky
        renderCart();
    </script>
</body>
</html>
