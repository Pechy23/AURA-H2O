<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokladna | AURA H2O</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://widget.packeta.com/v6/www/js/library.js"></script>
</head>
<body>
    <nav>
        <!-- 1. Logo vlevo -->
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="Logo" onerror="this.src='https://placehold.co/100x35/ccc/fff?text=LOGO'">
                <span>AURA H2O</span>
            </a>
        </div>

        <!-- 2. Odkazy uprostřed -->
        <div class="nav-links">
            <a href="index.html">Úvod</a>
            <a href="shop.html">Obchod</a>
            <a href="kontakt.html">Kontakt</a>
        </div>

        <!-- 3. Přihlášení a košík vpravo -->
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- Tlačítko Login / Účet -->
            <a href="login.html" id="auth-link" style="text-decoration: none; color: #444; font-weight: 500; font-size: 0.95rem; background: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); transition: all 0.3s;">
                Přihlásit
            </a>

            <!-- Košík -->
            <a href="kosik.html" class="cart-icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; stroke: currentColor;">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="nav-cart-badge" id="nav-cart-count">0</span>
            </a>
        </div>
    </nav>

    <main>
        <div class="card" style="max-width: 800px; width: 100%;">
            <h1>Pokladna</h1>
            <p style="margin-bottom: 20px;">Vyplňte dodací údaje a zvolte preferovaný způsob dopravy a platby.</p>
            
            <form action="#" method="POST" class="order-form">
                
                <!-- KROK 1: Osobní údaje -->
                <div class="checkout-section">1. Dodací údaje</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="jmeno">Jméno a příjmení</label>
                        <input type="text" id="jmeno" name="jmeno" placeholder="Jan Novák" required>
                    </div>
                    <div class="form-group">
                        <label for="telefon">Telefon</label>
                        <input type="tel" id="telefon" name="telefon" placeholder="+420 123 456 789" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mailová adresa</label>
                    <input type="email" id="email" name="email" placeholder="jan.novak@email.cz" required>
                </div>

                <div class="form-group">
                    <label for="adresa">Doručovací adresa (Ulice, Město, PSČ)</label>
                    <textarea id="adresa" name="adresa" rows="2" placeholder="Zadejte celou adresu..." required></textarea>
                </div>

                <!-- KROK 2: Doprava -->
                <div class="checkout-section">2. Způsob dopravy</div>
                <div class="radio-group">
                    
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <label class="radio-label">
                            <div class="radio-label-content">
                                <input type="radio" name="doprava" value="zasilkovna" data-price="79" checked required>
                                Zásilkovna - Z-Box / Výdejní místo
                            </div>
                            <div class="radio-price">79 Kč</div>
                        </label>
                        
                        <div id="zasilkovna-box" style="padding: 15px 20px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(5px); border-radius: 15px; border: 1px dashed rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; gap: 10px;">
                            <div id="zasilkovna-nazev" style="font-weight: 500; color: #444; font-size: 0.95rem;">Zatím nebylo vybráno žádné výdejní místo.</div>
                            <button id="zasilkovna-btn" type="button" class="btn-shop" style="padding: 10px 20px; font-size: 0.95rem; align-self: flex-start; box-shadow: none;">Vybrat pobočku na mapě &rarr;</button>
                            <input type="hidden" id="zasilkovna-id" name="zasilkovna-id" required>
                        </div>
                    </div>

                    <label class="radio-label">
                        <div class="radio-label-content">
                            <input type="radio" name="doprava" value="ppl" data-price="119">
                            PPL - Doručení na adresu
                        </div>
                        <div class="radio-price">119 Kč</div>
                    </label>

                    <label class="radio-label">
                        <div class="radio-label-content">
                            <input type="radio" name="doprava" value="posta" data-price="109">
                            Česká pošta - Balík do ruky
                        </div>
                        <div class="radio-price">109 Kč</div>
                    </label>
                </div>

                <!-- KROK 3: Platba -->
                <div class="checkout-section">3. Způsob platby</div>
                <div class="radio-group">
                    <label class="radio-label">
                        <div class="radio-label-content">
                            <input type="radio" name="platba" value="karta" data-price="0" checked required>
                            Kartou online
                        </div>
                        <div class="radio-price">Zdarma</div>
                    </label>

                    <label class="radio-label">
                        <div class="radio-label-content">
                            <input type="radio" name="platba" value="prevod" data-price="0">
                            Bankovní převod
                        </div>
                        <div class="radio-price">Zdarma</div>
                    </label>

                    <label class="radio-label">
                        <div class="radio-label-content">
                            <input type="radio" name="platba" value="dobirka" data-price="39">
                            Dobírka (platba při převzetí)
                        </div>
                        <div class="radio-price">+ 39 Kč</div>
                    </label>
                </div>

                <!-- KROK 4: Shrnutí -->
                <div class="order-summary">
                    <!-- Sem se dynamicky načtou položky z košíku -->
                    <div id="summary-items"></div>
                    
                    <hr style="border: 0; border-top: 2px solid rgba(255,255,255,0.7); margin: 15px 0;">
                    
                    <div class="summary-row">
                        <span>Doprava</span>
                        <span id="summary-doprava">79 Kč</span>
                    </div>
                    <div class="summary-row" id="summary-platba-row" style="display: none;">
                        <span>Příplatek za platbu</span>
                        <span id="summary-platba">0 Kč</span>
                    </div>
                    <div class="summary-total">
                        <span>Celkem k úhradě</span>
                        <span id="summary-celkem">0 Kč</span>
                    </div>
                </div>

                <button type="submit" class="btn-shop" style="padding: 20px; font-size: 1.2rem; width: 100%;">Dokončit objednávku &rarr;</button>
            </form>
        </div>
    </main>

    <script>
        // NAČTENÍ KOŠÍKU A VYKRESLENÍ POLOŽEK
        let cart = JSON.parse(localStorage.getItem('flowstate_cart')) || [];
        
        // Pokud je košík prázdný, přesměrujeme zákazníka zpět
        if (cart.length === 0) {
            window.location.href = 'kosik.html';
        }

        let basePrice = 0;
        let totalItems = 0;
        const summaryItems = document.getElementById('summary-items');

        cart.forEach(item => {
            const itemTotalPrice = item.price * item.quantity;
            basePrice += itemTotalPrice;
            totalItems += item.quantity;

            summaryItems.innerHTML += `
                <div class="summary-row" style="margin-bottom: 8px;">
                    <span>${item.quantity}x Láhev (${item.size}, ${item.color})</span>
                    <span>${itemTotalPrice} Kč</span>
                </div>
            `;
        });

        // Aktualizace čísla v navigaci
        document.getElementById('nav-cart-count').textContent = totalItems;

        // JS PRO DYNAMICKÝ VÝPOČET CENY (DOPRAVA + PLATBA)
        const dopravaInputs = document.querySelectorAll('input[name="doprava"]');
        const platbaInputs = document.querySelectorAll('input[name="platba"]');
        
        const summaryDoprava = document.getElementById('summary-doprava');
        const summaryPlatba = document.getElementById('summary-platba');
        const summaryPlatbaRow = document.getElementById('summary-platba-row');
        const summaryCelkem = document.getElementById('summary-celkem');

        const zasilkovnaBox = document.getElementById('zasilkovna-box');
        const zasilkovnaIdInput = document.getElementById('zasilkovna-id');

        function prepocitejCenu() {
            const vybranaDoprava = document.querySelector('input[name="doprava"]:checked');
            const vybranaPlatba = document.querySelector('input[name="platba"]:checked');

            const cenaDoprava = parseInt(vybranaDoprava.getAttribute('data-price')) || 0;
            const cenaPlatba = parseInt(vybranaPlatba.getAttribute('data-price')) || 0;

            if (vybranaDoprava.value === 'zasilkovna') {
                zasilkovnaBox.style.display = 'flex';
                zasilkovnaIdInput.required = true;
            } else {
                zasilkovnaBox.style.display = 'none';
                zasilkovnaIdInput.required = false;
            }

            summaryDoprava.textContent = cenaDoprava > 0 ? cenaDoprava + ' Kč' : 'Zdarma';

            if (cenaPlatba > 0) {
                summaryPlatba.textContent = cenaPlatba + ' Kč';
                summaryPlatbaRow.style.display = 'flex';
            } else {
                summaryPlatbaRow.style.display = 'none';
            }

            // Výsledná cena = položky v košíku + doprava + platba
            const celkovaCena = basePrice + cenaDoprava + cenaPlatba;
            summaryCelkem.textContent = celkovaCena + ' Kč';
        }

        dopravaInputs.forEach(input => input.addEventListener('change', prepocitejCenu));
        platbaInputs.forEach(input => input.addEventListener('change', prepocitejCenu));

        prepocitejCenu();

        // INICIALIZACE ZÁSILKOVNA MAPY (WIDGETU)
        document.getElementById('zasilkovna-btn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const packetaOptions = {
                country: "cz",
                language: "cs",
                valueFormat: "id"
            };
            
            Packeta.Widget.pick('1234567890', function(point) {
                if (point) {
                    document.getElementById('zasilkovna-nazev').innerHTML = `<strong style="color:#222;">Vybráno:</strong> ${point.name} (${point.city})`;
                    document.getElementById('zasilkovna-id').value = point.id;
                    
                    document.getElementById('zasilkovna-btn').style.background = "linear-gradient(90deg, #a3b19b, #8da083)";
                    document.getElementById('zasilkovna-btn').innerHTML = "Změnit výdejní místo";
                }
            }, packetaOptions);
        });

        // Po odeslání objednávky chceme košík vyprázdnit
        document.querySelector('.order-form').addEventListener('submit', function() {
            // Reálně by se zde data odeslala na server, my pro ilustraci vymažeme košík
            localStorage.removeItem('flowstate_cart');
        });
    </script>
</body>
</html>
